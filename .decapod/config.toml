schema_version = "1.0.0"

[init]
specs = true
ci = true
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "nixos"
product_summary = "NixOS system configuration for `cube`."
architecture_direction = "Composable repository architecture with explicit boundaries and proof-backed delivery invariants."
product_type = "service_or_library"
done_criteria = "Decapod validate passes, required tests pass, and promotion-relevant artifacts are present."
base_branch = "main"
primary_languages = ["shell"]
detected_surfaces = ["shell"]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "authentication",
    "background-processing",
    "event-driven",
    "external-integrations",
    "infrastructure-management",
    "persistent-state",
    "public-api",
    "secrets-handling",
]

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

[proof]
commands = []

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = []
